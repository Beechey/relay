# Every pull request (and main after a merge): build the app and run the unit tests. Branch protection requires
# the "build" check to pass before a pull request can be merged.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: test-reports, path: app/build/reports/tests/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        with: { name: relay-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
