# Tag v1.2.3 (or v1.2.3-beta.1 for a pre-release) -> signed APK published as a release on this repo, which the app
# checks for updates. Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Optional RELEASES_TOKEN (contents:write on Beechey/relay-releases): also publishes there, for installs from before
# updates moved to this repo.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check tag matches versionName
        run: grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts || { echo "Tag $GITHUB_REF_NAME doesn't match versionName in app/build.gradle.kts"; exit 1; }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease  # AGP 9 creates unit tests for debug only
      - run: cp app/build/outputs/apk/release/app-release.apk relay-iptv.apk  # same name every release: stable /releases/latest/download/relay-iptv.apk link
      - uses: actions/upload-artifact@v7
        with: { name: relay-iptv, path: relay-iptv.apk }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Relay IPTV ${{ github.ref_name }}
          files: relay-iptv.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
      - if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: Beechey/relay-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Relay IPTV ${{ github.ref_name }}
          files: relay-iptv.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
